ekf_filter_node:
  ros__parameters:
    frequency: 10.0
    sensor_timeout: 1.0
    two_d_mode: true
    # tf
    map_frame: map
    odom_frame: odom
    #base_link_frame: base_footprint
    #odom_topic: /odometry/filtered
    base_link_frame: base_link
    world_frame: odom           # broadcast odom -> base_footprint
    publish_tf: true
    transform_time_offset: 0.05
    transform_timeout: 0.1
    print_diagnostics: true
    debug: false
    publish_acceleration: false
    # firmware
    odom0: /base_controller/odom
    # [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    # take x, y, yaw, vx, vy, vyaw
